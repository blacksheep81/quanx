#############################################
# Quantumult X 合并配置 (blacksheep81/quanx)
# 汇总 GitHub 上仍在维护、经脚本验证可用的规则 / 重写 / 脚本
# 配置地址：https://raw.githubusercontent.com/blacksheep81/quanx/main/QuantumultX.conf
# 链接状态：https://github.com/blacksheep81/quanx/blob/main/STATUS.md
#
# ⚠️ 导入会覆盖你原来的全部配置，请先备份
# 使用步骤：
#   1. 风车 → 配置文件 → 下载 → 粘贴上面的配置地址
#   2. [server_remote] 填入你自己的机场订阅（或在 App 里 节点 → 引用 添加）
#   3. 风车 → MitM → 生成证书 → 安装并在 设置-通用-关于本机-证书信任设置 中信任
#   4. 打开 重写 / MitM 开关
#############################################

[general]
server_check_url=http://www.gstatic.com/generate_204
server_check_timeout=3000
# 节点页顶部显示当前出口 IP 位置
geo_location_checker=http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/IP_API.js
# 资源解析器：让 QX 能识别 Surge/Loon/Clash 格式的规则与订阅
resource_parser_url=https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
# 不走 fake-ip 的域名（运营商一键登录、银行类 App）
dns_exclusion_list=*.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn, *.cmbchina.com, *.10099.com.cn
excluded_routes=239.255.255.250/32, 24.105.30.129/32, 185.60.112.157/32, 185.60.112.158/32, 182.162.132.1/32
# YouTube 去广告需要禁用 QUIC（对 443 端口 UDP 直接丢弃，回落到 TCP）
udp_drop_list=443
fallback_udp_policy=direct
# 想在家里 Wi-Fi 全直连：改成 running_mode_trigger=filter, filter, 你的WiFi名:all_direct
running_mode_trigger=filter, filter

[dns]
no-ipv6
server=223.5.5.5
server=119.29.29.29
server=/*.icloud.com/119.29.29.29
server=/*.icloud.com.cn/119.29.29.29
server=/*.tencent.com/119.29.29.29
server=/*.weixin.qq.com/119.29.29.29
server=/*.taobao.com/223.5.5.5
server=/*.tmall.com/223.5.5.5
server=/*.alipay.com/223.5.5.5
