name: 每日更新合并规则 & 检查链接

on:
  schedule:
    - cron: "17 20 * * *"   # 每天北京时间 04:17
  workflow_dispatch:
  push:
    paths:
      - QuantumultX.conf
      - scripts/**
      - tasks/**
      - .github/workflows/update.yml

concurrency:
  group: quanx-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 合并规则并检查链接
        run: python3 scripts/build.py
      - name: 提交更新
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules STATUS.md
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "chore: 自动更新合并规则与链接状态"
            git push
          fi
