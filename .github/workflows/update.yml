name: 每日更新合并规则 & 检查链接

on:
  schedule:
    - cron: "17 20 * * *"   # 每天北京时间 04:17
  workflow_dispatch:
  push:
    paths:
      - QuantumultX.conf
      - scripts/**
      - tasks/**
      - .github/workflows/update.yml

# 避免定时任务和 push 触发同时运行导致 git push 冲突
concurrency:
  group: quanx-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 合并规则并检查链接
        id: build
        continue-on-error: true   # 先把 STATUS.md 提交上去，最后一步再报错
        run: python3 scripts/build.py
      - name: 提交更新
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules STATUS.md
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "chore: 自动更新合并规则与链接状态"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
      - name: 有失效链接或上游异常时报错
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::有链接失效或上游规则异常，详情见 STATUS.md"
          exit 1
